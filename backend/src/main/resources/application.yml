server:
  port: 22222
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: campus-venue
  profiles:
    default: '@app.default-profile@'
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
  mvc:
    problemdetails:
      enabled: true
